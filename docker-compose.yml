services:

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: jenkins-ubuntu104 #nom de machine dans console tailscale
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - com.centurylinklabs.watchtower.enable=true #autoupdate par nickfedor/watchtower
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - ${HOME}/jenkins/tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - /etc/localtime:/etc/localtime:ro
      - ${HOME}/jenkins/certs:/certs
    environment:
      - "TS_AUTHKEY=<TAILSCALE_AUTH_KEY>" #<----- Remplacez <TAILSCALE_AUTH_KEY> par votre clé d'authentification Tailscale
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_CERT_DOMAIN=jenkins-ubuntu104.tail358360.ts.net
    dns:
      - 100.100.100.100 # pour que jenkins puisse résoudre les noms de domaine via Tailscale
      - 1.1.1.1
    networks:
      - jenkins-net
    # plus de network_mode: host, plus de ports: exposés
    # le netns du container est désormais isolé, seul le mesh tailscale y accède

  jenkins:
    image: jenkins/jenkins:2.568.2-lts
    container_name: jenkins
    restart: unless-stopped
    depends_on:
      tailscale: 
        condition: service_healthy # Jenkins redémarre automatiquement si tailscale healthcheck OK plus robuste que service_started , comme liveness/readyness K8S vivant et fonctionnel c different
        restart: true
    network_mode: service:tailscale   # rejoint le netns isolé de tailscale, inchangé
    user: root
    environment:
      - JENKINS_OPTS=--sessionTimeout=2880
      - JAVA_OPTS=-Dorg.apache.commons.jelly.tags.fmt.timeZone=Europe/Paris -Dsun.net.inetaddr.ttl=0 -Dsun.net.inetaddr.negative.ttl=0 -Djava.net.preferIPv4Stack=true -Dnetworkaddress.cache.ttl=0 -Dnetworkaddress.cache.negative.ttl=0 -Dsun.net.spi.nameservice.nameservers=100.100.100.100 -Dsun.net.spi.nameservice.provider.1=dns,sun
    volumes:
      - ${HOME}/jenkins/jenkins-data:/var/jenkins_home
      - /etc/localtime:/etc/localtime:ro

  nginx:
    image: nginx:alpine
    container_name: nginx-jenkins
    restart: unless-stopped
    depends_on:
      jenkins:
        condition: service_started
      tailscale: 
        condition: service_healthy # plus robuste que service_started , comme liveness/readyness K8S vivant et fonctionnel c different
        restart: true
    network_mode: service:tailscale
    volumes:
      - ${HOME}/jenkins/nginx.conf:/etc/nginx/conf.d/jenkins.conf:ro
      - ${HOME}/jenkins/certs:/certs:ro
      - /etc/localtime:/etc/localtime:ro

networks:
  jenkins-net:
    driver: bridge